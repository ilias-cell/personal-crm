# Site file of the app. deploy.sh installs it as /etc/nginx/sites-available/app.therooks.ru (its own file only;
# the landing's and the catch-all files are never touched) after "nginx -t" accepts the whole configuration.
server {
    listen 80;
    listen [::]:80;
    server_name app.therooks.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.therooks.ru;

    # same certificate as the landing: it covers both names
    ssl_certificate     /etc/letsencrypt/live/therooks.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therooks.ru/privkey.pem;
    include snippets/tls-params.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
