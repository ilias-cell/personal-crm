# Site file of the test stand. deploy.sh installs it as /etc/nginx/sites-available/test-app.therooks.ru (its own file only;
# the landing's, the prod app's and the catch-all files are never touched) after "nginx -t" accepts the whole configuration.
# The whole site is closed with a password (/etc/nginx/htpasswd-test-app, created by hand once, see README).
server {
    listen 80;
    listen [::]:80;
    server_name test-app.therooks.ru;

    # the certificate is issued and renewed through this folder
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-app.therooks.ru;

    # its own certificate, issued by setup-staging-domain.sh
    ssl_certificate     /etc/letsencrypt/live/test-app.therooks.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.therooks.ru/privkey.pem;
    include snippets/tls-params.conf;

    # everything on this host, /health included, needs the password
    auth_basic           "Test stand";
    auth_basic_user_file /etc/nginx/htpasswd-test-app;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
