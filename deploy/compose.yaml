# Stack of one environment on the server: prod (~/crm, -p prod) or the test stand (~/crm-staging, -p staging).
# Run it through the scripts: they set APP_IMAGE, the project name, APP_PORT and the memory limits (see set_env in lib.sh).
# Settings come from .env next to this file (never in git); every environment has its own:
#   database: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   login: OWNER_EMAIL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, SMTP_URL, MAIL_FROM

# Container logs go to the server journal (journald): they survive recreating a container, a deploy and a rollback.
# The journal size is limited by the system, so old lines are deleted and the disk does not fill up.
# The tag is the container name (prod-app-1, staging-db-1, ...): journalctl -t prod-app-1
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  # Login: the secret signs the cookies, the address is used in the links of the emails,
  # SMTP_URL and MAIL_FROM say where and from whom the login emails are sent.
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
  SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published ports: only containers of this project reach the database.
    mem_limit: ${DB_MEM_LIMIT:-0}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container: applies migrations and exits. The deploy starts the new app only if it succeeds.
  # OWNER_EMAIL: the login migration gives the contacts that existed before login to the user with this email.
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    pull_policy: never
    profiles: [tools]
    command: ["node", "tools/migrate.js"]
    mem_limit: ${APP_MEM_LIMIT:-0}
    environment:
      <<: *app-env
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # One-off container: fills an EMPTY database with test contacts (it refuses a non-empty one).
  # The test contacts belong to the user with OWNER_EMAIL.
  seed:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    pull_policy: never
    profiles: [tools]
    command: ["node", "tools/seed.js"]
    environment:
      <<: *app-env
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    pull_policy: never
    restart: unless-stopped
    environment: *app-env
    mem_limit: ${APP_MEM_LIMIT:-0}
    ports:
      # Localhost only: the public side is nginx with https. The port on the server differs per environment.
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

volumes:
  db-data:
