name: Deploy

# Push to main -> image tagged with the commit SHA in GHCR -> on the server: migrations, new image, smoke /health.
# All server logic lives in deploy/; this file only builds the image and calls those scripts.
on:
  push:
    branches: [main]

# Two deploys must never run at once; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DOMAIN: app.therooks.ru

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy deploy scripts to the server
        run: tar -C deploy -cf - . | ssh server 'mkdir -p ~/crm && tar -xf - -C ~/crm'

      - name: Roll out the new image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | ssh server "~/crm/deploy.sh '$IMAGE' '$REGISTRY_USER'"

      - name: Smoke test from outside
        run: deploy/smoke.sh "https://$APP_DOMAIN/health" "${GITHUB_SHA}" 60
