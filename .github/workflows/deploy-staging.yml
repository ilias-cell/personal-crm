name: Deploy staging

# Push to main -> one image tagged with the commit SHA in GHCR -> the test stand: migrations, new image, smoke /health.
# Prod is NOT rolled out here: it is rolled out only by the "Deploy prod" workflow, started by hand.
# "Deploy prod" takes the commit of the latest green run of this workflow, so the name of this file matters for it.
# All server logic lives in deploy/; this file only builds the image and calls those scripts.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    # Two deploys must never run at once on one environment; a newer one waits instead of cancelling a running one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: deploy/prepare-ssh.sh

      - name: Copy deploy scripts to the server
        run: tar -C deploy -cf - . | ssh server 'mkdir -p ~/crm-staging && tar -xf - -C ~/crm-staging'

      - name: Roll out the new image on the test stand
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | ssh server "~/crm-staging/deploy.sh staging '$IMAGE' '$REGISTRY_USER'"
